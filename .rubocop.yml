AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Relax metrics for test files and generators
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_publishable/configuration.rb'
    - 'lib/recording_studio_publishable/hooks.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'db/migrate/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_publishable/parent_recordable.rb'
    - 'lib/recording_studio_publishable/services/**/*'
    - 'lib/recording_studio/capabilities/publishable.rb'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'db/migrate/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_publishable/services/**/*'

Metrics/BlockLength:
  Exclude:
    - 'lib/recording_studio_publishable/parent_recordable.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/recording_studio_publishable/services/**/*'
    - 'lib/recording_studio_publishable/routing.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/recording_studio_publishable/services/**/*'
    - 'lib/recording_studio_publishable/routing.rb'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'lib/recording_studio_publishable/services/**/*'
    - 'test/services/**/*'
